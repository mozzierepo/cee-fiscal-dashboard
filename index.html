<style>
:root {
  --radius: 0.75rem;
  --background: #f7f9fb;
  --foreground: #17233b;
  --card: #ffffff;
  --muted: #edf2f7;
  --muted-foreground: #68748a;
  --primary: #2053a3;
  --primary-foreground: #ffffff;
  --accent: #0b8aa6;
  --success: #16915c;
  --warning: #d68b00;
  --destructive: #c9342e;
  --border: #dde5ee;
  --input: #dbe3ed;
  --chart-1: #2053a3;
  --chart-2: #0b8aa6;
  --chart-3: #16915c;
  --chart-4: #d68b00;
  --chart-5: #bb3e9b;
  --gradient-primary: linear-gradient(135deg, #2053a3, #0b8aa6);
  --shadow-card: 0 1px 3px rgba(32,83,163,.08), 0 4px 16px rgba(32,83,163,.06);
  --shadow-elevated: 0 8px 32px rgba(32,83,163,.15);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.shell { min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.92); backdrop-filter: blur(10px); }
.topbar-inner { max-width: 1480px; margin: 0 auto; padding: 12px 24px 8px; display: flex; flex-direction: column; gap: 4px; }
.filters { display: flex; align-items: center; gap: 8px; width: 100%; }
.logo-mark { height: 34px; width: auto; margin-right: 4px; object-fit: contain; }
select, .search-input, textarea { border: 1px solid var(--border); background: var(--background); color: var(--foreground); border-radius: 10px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); outline: none; }
select:focus, .search-input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(32,83,163,.13); }
.filter-select { height: 36px; padding: 0 12px; font-size: 14px; font-weight: 600; }
.region-select { flex: 1; min-width: 170px; }
.school-select { width: 480px; max-width: 42vw; }
.btn { height: 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--background); color: var(--muted-foreground); padding: 0 12px; font-size: 12px; font-weight: 700; transition: .15s ease; white-space: nowrap; }
.btn:hover { background: var(--muted); color: var(--foreground); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); padding: 0 24px; margin-left: auto; }
.btn-primary:hover { filter: brightness(.96); background: var(--primary); color: var(--primary-foreground); }
.count-pill { white-space: nowrap; border: 1px solid var(--border); background: var(--muted); color: #2e3950; border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: 700; }
.check-pill { height: 36px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--background); padding: 0 10px; border-radius: 10px; font-size: 12px; font-weight: 700; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
.check-pill input { width: 14px; height: 14px; accent-color: var(--chart-2); }
.date-line { align-self: flex-end; color: var(--muted-foreground); font-size: 12px; font-weight: 700; white-space: nowrap; }
main { max-width: 1480px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.card, .kpi { border: 1px solid var(--border); background: var(--card); border-radius: 20px; box-shadow: var(--shadow-card); }
.kpi { position: relative; overflow: hidden; padding: 20px; transition: box-shadow .15s ease; }
.kpi:hover { box-shadow: var(--shadow-elevated); }
.kpi::before { content: ""; position: absolute; inset: 0; opacity: .62; background: linear-gradient(135deg, rgba(32,83,163,.13), transparent); }
.kpi.accent::before { background: linear-gradient(135deg, rgba(11,138,166,.14), transparent); }
.kpi.success::before { background: linear-gradient(135deg, rgba(22,145,92,.14), transparent); }
.kpi.warning::before { background: linear-gradient(135deg, rgba(214,139,0,.17), transparent); }
.kpi.destructive::before { background: linear-gradient(135deg, rgba(201,52,46,.14), transparent); }
.kpi-content { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.kpi-label { margin: 0; color: var(--muted-foreground); font-size: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: .05em; }
.kpi-value { margin: 4px 0 0; font-size: 24px; line-height: 1.2; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi-sub { margin: 4px 0 0; color: var(--muted-foreground); font-size: 12px; }
.kpi-trend { margin: 6px 0 0; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi-icon { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: rgba(32,83,163,.10); color: var(--primary); flex: 0 0 auto; }
.kpi.accent .kpi-icon { background: rgba(11,138,166,.10); color: var(--accent); }
.kpi.success .kpi-icon { background: rgba(22,145,92,.10); color: var(--success); }
.kpi.warning .kpi-icon { background: rgba(214,139,0,.15); color: var(--warning); }
.kpi.destructive .kpi-icon { background: rgba(201,52,46,.10); color: var(--destructive); }
.card { padding: 20px; }
.card-head { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-title { margin: 0; font-size: 14px; font-weight: 800; }
.card-desc { margin: 2px 0 0; color: var(--muted-foreground); font-size: 12px; }
.util-card { padding: 24px; }
.util-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.eyebrow { margin: 0; color: var(--muted-foreground); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
.util-total { margin: 4px 0 0; font-size: 20px; font-weight: 800; }
.util-total span { color: var(--muted-foreground); font-size: 14px; font-weight: 500; }
.util-pct { margin: 0; color: var(--primary); font-size: 32px; line-height: 1; font-weight: 850; font-variant-numeric: tabular-nums; text-align: right; }
.util-sub { margin: 4px 0 0; color: var(--muted-foreground); font-size: 12px; text-align: right; }
.stacked { display: flex; height: 20px; overflow: hidden; border-radius: 999px; background: var(--muted); border: 1px solid var(--border); }
.stacked-spent { background: var(--primary); }
.stacked-avail { background: var(--success); }
.legend-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.legend-card { border: 1px solid var(--border); border-radius: 14px; background: rgba(237,242,247,.55); padding: 12px; }
.legend-card.success-bg { background: rgba(22,145,92,.06); }
.legend-top { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 99px; background: var(--primary); }
.dot.success { background: var(--success); }
.legend-value { margin: 6px 0 0; font-size: 18px; font-weight: 850; font-variant-numeric: tabular-nums; }
.legend-sub { margin: 0; color: var(--muted-foreground); font-size: 12px; }
.grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chart-wrap { width: 100%; height: 420px; overflow: hidden; }
.chart-wrap.small { height: 260px; }
.chart-wrap.pie { height: 340px; }
.chart-wrap.tall { height: 480px; }
svg.chart { width: 100%; height: 100%; display: block; overflow: visible; }
.axis-label { fill: var(--muted-foreground); font-size: 11px; }
.x-label { fill: var(--foreground); font-size: 11px; }
.chart-legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; color: var(--muted-foreground); font-size: 12px; margin-top: -8px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { padding: 8px 12px 8px 0; text-align: left; color: var(--muted-foreground); font-size: 12px; line-height: 1.2; text-transform: uppercase; letter-spacing: .05em; font-weight: 750; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid rgba(221,229,238,.72); vertical-align: middle; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover, tbody tr.expandable:hover { background: rgba(237,242,247,.7); }
tr:last-child td { border-bottom: 0; }
.text-right { text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; color: var(--muted-foreground); }
.muted { color: var(--muted-foreground); }
.success { color: var(--success); }
.warning { color: var(--warning); }
.danger { color: var(--destructive); }
.bold { font-weight: 800; }
.tabular { font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 7px; padding: 2px 6px; font-size: 12px; font-weight: 800; }
.badge.good { color: var(--success); background: rgba(22,145,92,.10); }
.badge.warn { color: var(--warning); background: rgba(214,139,0,.15); }
.badge.bad { color: var(--destructive); background: rgba(201,52,46,.10); }
.table-action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.search-box { position: relative; }
.search-box .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); }
.search-input { height: 36px; width: 260px; padding: 0 12px 0 32px; font-size: 14px; }
.footer { margin: 0; padding-bottom: 16px; color: var(--muted-foreground); font-size: 12px; text-align: center; }
.comment-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.comment-label { display: block; margin: 0 0 6px; color: var(--muted-foreground); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 800; }
textarea { min-height: 76px; width: 100%; resize: vertical; background: var(--card); padding: 9px 11px; font-size: 14px; }
.drawer-layer { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.drawer-backdrop { position: absolute; inset: 0; background: rgba(23,35,59,.30); backdrop-filter: blur(4px); }
.drawer { position: relative; display: flex; flex-direction: column; width: min(100%, 672px); height: 100%; overflow-y: auto; border-left: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-elevated); }
.drawer-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.96); backdrop-filter: blur(10px); padding: 16px 24px; }
.drawer-head h2 { margin: 2px 0; font-size: 18px; }
.close-btn { border: 0; background: transparent; color: var(--muted-foreground); border-radius: 10px; padding: 7px; font-size: 22px; line-height: 1; }
.close-btn:hover { background: var(--muted); color: var(--foreground); }
.drawer-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mini-stat, .yoy-cell, .info-box { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 12px; }
.mini-stat p, .yoy-cell p { margin: 0; }
.mini-stat .label, .yoy-cell .label { color: var(--muted-foreground); font-size: 12px; }
.mini-stat .value { margin-top: 4px; font-size: 18px; font-weight: 800; }
.yoy-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.yoy-cell { background: rgba(237,242,247,.55); }
.yoy-cell.highlight { color: white; background: var(--gradient-primary); }
.yoy-cell.highlight .label { color: rgba(255,255,255,.8); }
.yoy-cell .value { margin-top: 4px; font-size: 14px; font-weight: 800; }
.program-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.program-tag { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--muted); padding: 5px 11px; font-size: 12px; }
.program-count { background: rgba(32,83,163,.10); color: var(--primary); border-radius: 999px; padding: 2px 6px; font-family: ui-monospace, monospace; }
.staff-detail td { background: rgba(237,242,247,.48); }
.mobile-filter-note { display: none; color: var(--muted-foreground); font-size: 12px; }
@media (max-width: 1120px) {
  .kpi-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .filters { flex-wrap: wrap; }
  .school-select { width: auto; max-width: none; flex: 1 1 360px; }
  .btn-primary { margin-left: 0; }
}
@media (max-width: 720px) {
  .topbar-inner, main { padding-left: 14px; padding-right: 14px; }
  .logo-mark { display:none; }
  .kpi-grid, .legend-grid, .comment-grid, .mini-grid, .yoy-grid { grid-template-columns: 1fr; }
  .region-select, .school-select, .filter-select, .search-input { width: 100%; max-width: none; flex: 1 1 100%; }
  .check-pill, .count-pill, .btn { flex: 1 1 auto; justify-content: center; }
  .card, .kpi { border-radius: 16px; }
  .chart-wrap { height: 360px; }
  .chart-wrap.tall { height: 430px; }
}
@media print { .topbar, .btn, .drawer-layer { display:none!important; } body { background:white; } main { max-width: none; } .card, .kpi { break-inside: avoid; box-shadow: none; } }
</style>

<script>
(function() {
  const chartColors = ['#2053a3','#0b8aa6','#16915c','#d68b00','#bb3e9b'];
  const state = { region: 'ALL', school: 'ALL', search: '', showPositive: true, showNegative: true, sortBy: 'currBudget', selected: null, expandedStaff: new Set(), commentEdits: loadJson('ceeCommentEdits', {}) };
  const data = BUDGET_DATA;
  const locations = data.locations || [];
  const app = document.getElementById('app');

  function loadJson(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || ''); } catch { return fallback; } }
  function saveJson(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
  function fmtMoney(n, compact=false) {
    n = Number(n) || 0;
    if (compact) { const abs = Math.abs(n); if (abs >= 1000000) return (n < 0 ? '-' : '') + '$' + (abs/1000000).toFixed(2) + 'M'; if (abs >= 1000) return (n < 0 ? '-' : '') + '$' + (abs/1000).toFixed(1) + 'K'; }
    return n.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  }
  function fmtNum(n) { return (Number(n)||0).toLocaleString('en-US'); }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function shortRegion(s) { return (s || '').replace(/REGION OFFICE$/i, '').trim() || '—'; }
  function padLoc(n) { return String(n).padStart(4, '0'); }
  function employeeName(e) {
    if (!e || !String(e).trim()) return '';
    const title = s => s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : '';
    const parts = String(e).split(',').map(s => s.trim());
    if (parts.length >= 2) { const first = (parts[1].split(/\s+/)[0] || ''); return (title(first) + ' ' + (parts[0][0] || '').toUpperCase() + '.').trim(); }
    const tokens = String(e).trim().split(/\s+/); if (tokens.length === 1) return title(tokens[0]);
    return (title(tokens[0]) + ' ' + (tokens[tokens.length-1][0] || '').toUpperCase() + '.').trim();
  }
  function icon(name) {
    const map = {
      wallet:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V7"/><path d="M16 14h.01"/></svg>',

      bank:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>',

      search:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',

    };
    return map[name] || '';
  }
  function getRegions() {
    const order = ['SOUTH','NORTH','CENTRAL'];
    const rank = r => { const i = order.findIndex(o => String(r).toUpperCase().includes(o)); return i < 0 ? order.length : i; };
    return ['ALL', ...Array.from(new Set(locations.filter(l => l.region).map(l => l.region))).sort((a,b) => rank(a)-rank(b) || a.localeCompare(b))];
  }
  function schoolOptions() { return locations.filter(l => state.region === 'ALL' || l.region === state.region).sort((a,b) => a.name.localeCompare(b.name)); }
  function filtered() {
    const q = state.search.trim().toLowerCase();
    const params = new URLSearchParams(location.search); const jobKey = /^\d{4}$/.test(params.get('jobkey') || '') ? params.get('jobkey') : '';
    return locations.filter(l => {
      if (!l.region) return false;
      if (jobKey && String(l.loc).slice(0,4) !== jobKey) return false;
      if (state.region !== 'ALL' && l.region !== state.region) return false;
      if (state.school !== 'ALL' && String(l.loc) !== state.school) return false;
      if (q && !l.name.toLowerCase().includes(q) && !String(l.loc).includes(q)) return false;

      return true;
    });
  }

  }
  function scope(rows) { return rows.reduce((a,l) => { a.curr+=l.currBudget; a.exp+=l.ytdExp; a.avail+=l.availBal; a.enc+=l.ytdEnc; a.orig+=l.origBudget; a.enr+=l.enrollment2526; a.enr2425+=l.enrollment2425; a.enr2324+=l.enrollment2324; a.budget2324+=l.budget2324; a.budget2425+=l.budget2425; a.pos+=l.positions; a.emp+=l.employees; return a; }, {curr:0,exp:0,avail:0,enc:0,orig:0,enr:0,enr2425:0,enr2324:0,budget2324:0,budget2425:0,pos:0,emp:0}); }
  function byRegion(rows) { const m = new Map(); rows.forEach(l => { const r = m.get(l.region) || {region:l.region,budget:0,spent:0,available:0}; r.budget += l.currBudget; r.spent += l.ytdExp; r.available += l.availBal; m.set(l.region, r); }); return [...m.values()].sort((a,b)=>b.budget-a.budget); }
  function byFunction(rows) { const m = new Map(); rows.forEach(l => (l.functions||[]).forEach(f => { if (f.name) m.set(f.name, (m.get(f.name)||0) + f.spent); })); return [...m.entries()].map(([name,value])=>({name,value})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6); }
  function getComment(loc) { return Object.assign({reason:'', recommendation:'', regionRecommend:''}, COMMENTS_DATA[String(loc)] || {}, state.commentEdits[String(loc)] || {}); }

  function kpi(label, value, sub, iconName, accent, trend, positive=true) {
    return `<div class="kpi ${accent||''}"><div class="kpi-content"><div><p class="kpi-label">${esc(label)}</p><p class="kpi-value">${esc(value)}</p>${sub ? `<p class="kpi-sub">${esc(sub)}</p>` : ''}${trend ? `<p class="kpi-trend ${positive?'success':'danger'}">${esc(trend)}</p>` : ''}</div><div class="kpi-icon">${icon(iconName)}</div></div></div>`;
  }
  function card(title, desc, body, action='') { return `<section class="card"><div class="card-head"><div><h3 class="card-title">${esc(title)}</h3>${desc !== undefined && desc !== '' ? `<p class="card-desc">${esc(desc)}</p>` : ''}</div>${action}</div>${body}</section>`; }
  function render() {
    const rows = filtered(); const sorted = sortedRows(rows); const sc = scope(rows); const utilization = sc.curr > 0 ? sc.exp / sc.curr : 0; const enrollDelta = sc.enr2425 > 0 ? (sc.enr - sc.enr2425) / sc.enr2425 : 0;
    const isFiltered = state.region !== 'ALL' || state.school !== 'ALL' || state.search.trim();
    const yoy = isFiltered ? [{year:'FY 23/24', budget:sc.budget2324, enrollment:sc.enr2324},{year:'FY 24/25', budget:sc.budget2425, enrollment:sc.enr2425},{year:'FY 25/26', budget:sc.curr, enrollment:sc.enr}] : [{year:'FY 23/24', budget:data.totals.budget2324, enrollment:data.totals.enrollment2324},{year:'FY 24/25', budget:data.totals.budget2425, enrollment:data.totals.enrollment2425},{year:'FY 25/26', budget:data.totals.currBudget, enrollment:data.totals.enrollment2526}];
    const canExport = state.region !== 'ALL' || state.school !== 'ALL';

        <select id="schoolSelect" class="filter-select school-select"><option value="ALL">All Schools (${schoolOptions().length})</option>${schoolOptions().map(l => `<option value="${l.loc}" ${String(l.loc)===state.school?'selected':''}>${padLoc(l.loc)} — ${esc(l.name)}</option>`).join('')}</select>
        ${(state.region !== 'ALL' || state.school !== 'ALL' || state.search) ? '<button id="clearBtn" class="btn">Clear</button>' : ''}
        <label class="check-pill"><input id="positiveBox" type="checkbox" ${state.showPositive?'checked':''}> Positive</label>
        <label class="check-pill"><input id="negativeBox" type="checkbox" ${state.showNegative?'checked':''}> Negative</label>
        <span class="count-pill">${rows.length} ${rows.length === 1 ? 'location' : 'locations'}</span>
        ${canExport && rows.length > 0 ? '<button id="exportBtn" class="btn btn-primary">Export to Excel</button>' : ''}
      </div><span class="date-line">Data as of 05/13/2026</span></div></header>
      <main>
        <section class="kpi-grid">
          ${kpi('Current Budget', fmtMoney(sc.curr,true), 'Original: '+fmtMoney(sc.orig,true), 'wallet', 'primary')}
          ${kpi('Enrollment 25/26', fmtNum(sc.enr), `24/25: ${fmtNum(sc.enr2425)} · 23/24: ${fmtNum(sc.enr2324)}`, 'grad', 'warning', `${enrollDelta>=0?'+':''}${(enrollDelta*100).toFixed(1)}%`, enrollDelta >= 0)}
          ${kpi('Positions', fmtNum(sc.pos), `${fmtNum(sc.emp)} employees filled`, 'building', 'accent')}

  function renderUtilization(sc, utilization) { const total = Math.max(sc.curr,1), spentPct=(sc.exp/total)*100, encPct=(sc.enc/total)*100, availPct=Math.max(0,100-spentPct-encPct); return `<section class="card util-card"><div class="util-head"><div><p class="eyebrow">Budget Utilization</p><p class="util-total">${fmtMoney(sc.curr,true)} <span>total current budget</span></p></div><div><p class="util-pct">${(utilization*100).toFixed(1)}%</p><p class="util-sub">of budget spent</p></div></div><div class="stacked"><div class="stacked-spent" style="width:${Math.max(0,spentPct)}%"></div><div class="stacked-avail" style="width:${availPct}%"></div></div><div class="legend-grid"><div class="legend-card"><div class="legend-top"><span class="dot"></span><p class="eyebrow">Spent</p></div><p class="legend-value">${fmtMoney(sc.exp,true)}</p><p class="legend-sub">${spentPct.toFixed(1)}% of budget</p></div><div class="legend-card success-bg"><div class="legend-top"><span class="dot success"></span><p class="eyebrow">Remaining</p></div><p class="legend-value success">${fmtMoney(sc.avail,true)}</p><p class="legend-sub">${availPct.toFixed(1)}% available</p></div></div></section>`; }
  function renderComment(l) { const c = getComment(l.loc); return card(`Comment · ${l.name}`, '', `<div class="comment-grid"><div><label class="comment-label">Reason / Comment</label><textarea id="commentReason" placeholder="e.g. Staff Expenditures/Fringes">${esc(c.reason)}</textarea></div><div><label class="comment-label">CEE Recommend</label><textarea id="commentRecommendation" placeholder="e.g. POP + Community">${esc(c.recommendation)}</textarea></div><div><label class="comment-label">Region Recommend</label><textarea id="commentRegion" placeholder="Add region recommendation…">${esc(c.regionRecommend || '')}</textarea></div></div>`, `<button id="saveComment" class="btn btn-primary" style="margin-left:0">Save</button>`); }
  function renderPrograms(l) { const rows = (l.programs || []).filter(p => p.enrollment > 0).sort((a,b)=>b.enrollment-a.enrollment); const grand = rows.reduce((s,p)=>s+p.enrollment,0); return card('Enrollment by Program', 'Program-level enrollment for selected school (FY 25/26)', `<div class="table-wrap"><table><thead><tr><th>Program</th><th class="text-right">Enrollment</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.program)}</td><td class="text-right tabular">${fmtNum(p.enrollment)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted" style="text-align:center;padding:14px">No program enrollment data</td></tr>'}<tr><td class="bold">Grand Total</td><td class="text-right tabular bold">${fmtNum(grand)}</td></tr></tbody></table></div>`); }
  function renderRegionTable(rows) { return card('By Region', 'Aggregated current budget, spend, and balance', `<div class="table-wrap"><table><thead><tr><th>Region</th><th class="text-right">Current Budget</th><th class="text-right">YTD Spent</th><th class="text-right">Available</th><th class="text-right">Utilization</th></tr></thead><tbody>${byRegion(rows).map(r => { const u = r.budget > 0 ? r.spent/r.budget : 0; return `<tr><td class="bold">${esc(r.region)}</td><td class="text-right tabular">${fmtMoney(r.budget,true)}</td><td class="text-right tabular">${fmtMoney(r.spent,true)}</td><td class="text-right tabular success">${fmtMoney(r.available,true)}</td><td class="text-right"><span class="badge good">${(u*100).toFixed(0)}%</span></td></tr>`; }).join('')}</tbody></table></div>`); }
  function renderLocations(rows) { const action = `<div class="table-action-row"><div class="search-box"><span class="icon">${icon('search')}</span><input id="searchInput" class="search-input" value="${esc(state.search)}" placeholder="Search name or location #"></div><select id="sortSelect" class="filter-select"><option value="currBudget" ${state.sortBy==='currBudget'?'selected':''}>Sort: Current Budget</option><option value="ytdExp" ${state.sortBy==='ytdExp'?'selected':''}>Sort: YTD Spent</option><option value="availBal" ${state.sortBy==='availBal'?'selected':''}>Sort: Available</option><option value="enrollment2526" ${state.sortBy==='enrollment2526'?'selected':''}>Sort: Enrollment 25/26</option><option value="name" ${state.sortBy==='name'?'selected':''}>Sort: Name</option></select></div>`; return card('Locations', 'Search, sort, and drill into any location', `<div class="table-wrap"><table><thead><tr><th>Loc</th><th>Name</th><th>Region</th><th class="text-right">Budget</th><th class="text-right">Spent</th><th class="text-right">Available</th><th class="text-right">Util</th><th class="text-right">Enr 25/26</th><th class="text-right">Positions</th><th class="text-right">YoY Enr</th><th></th></tr></thead><tbody>${rows.slice(0,80).map(l => { const u = l.currBudget>0 ? l.ytdExp/l.currBudget : 0; const y = l.enrollment2425 > 0 ? (l.enrollment2526-l.enrollment2425)/l.enrollment2425 : null; const cls = u>.95?'bad':u>.8?'warn':'good'; return `<tr class="clickable" data-open="${l.loc}"><td class="mono">${padLoc(l.loc)}</td><td class="bold">${esc(l.name)}</td><td class="muted" style="font-size:12px">${esc(shortRegion(l.region))}</td><td class="text-right tabular">${fmtMoney(l.currBudget,true)}</td><td class="text-right tabular">${fmtMoney(l.ytdExp,true)}</td><td class="text-right tabular success">${fmtMoney(l.availBal,true)}</td><td class="text-right"><span class="badge ${cls}">${(u*100).toFixed(0)}%</span></td><td class="text-right tabular">${fmtNum(l.enrollment2526)}</td><td class="text-right tabular">${icon('building')} ${fmtNum(l.positions)} <span class="muted">/ ${fmtNum(l.employees)}</span></td><td class="text-right">${y === null ? '' : `<span class="${y>=0?'success':'danger'}">${icon(y>=0?'up':'down')} ${(y*100).toFixed(0)}%</span>`}</td><td class="text-right muted">›</td></tr>`; }).join('')}</tbody></table>${rows.length > 80 ? `<p class="footer">Showing 80 of ${rows.length}. Refine with search or region filter.</p>` : ''}</div>`, action); }
  function renderEmployeeRoster(l) { const staff = l.staff || []; const vacant = Math.max(0, l.positions-l.employees); return card(`Employees · ${l.name}`, `${l.employees} filled of ${l.positions} authorized positions · ${vacant} vacant`, `<div class="table-wrap"><table><thead><tr><th>#</th><th>Employee</th><th>Job Title</th><th>Position #</th><th class="text-right">Status</th></tr></thead><tbody>${staff.length ? staff.map((s,i)=>{ const filled = !!(s.employee && s.employee.trim()); return `<tr><td class="mono">${String(i+1).padStart(3,'0')}</td><td class="bold">${icon('users')} ${filled ? esc(employeeName(s.employee)) : '<span class="muted"><em>— Vacant —</em></span>'}</td><td class="mono">${esc(s.position)}</td><td>${esc(s.job)}</td><td class="text-right"><span class="badge ${filled?'good':'warn'}">${filled?'Filled':'Vacant'}</span></td></tr>`;}).join('') : '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">No staff roster data available for this location.</td></tr>'}</tbody>${staff.length ? `<tfoot><tr><td colspan="4" class="bold">Total · ${staff.length} positions</td><td class="text-right tabular muted">${staff.filter(s=>s.employee&&s.employee.trim()).length} filled</td></tr></tfoot>` : ''}</table></div>`); }
  function renderPositions(rows, sc) { const list = [...rows].sort((a,b)=>b.positions-a.positions).slice(0,80); return card('Positions & Employees', 'Authorized positions, filled employees, and vacancies by location', `<div class="table-wrap"><table><thead><tr><th></th><th>Loc</th><th>School</th><th>Region</th><th class="text-right">Positions</th><th class="text-right">Filled</th><th class="text-right">Vacant</th><th class="text-right">Fill Rate</th></tr></thead><tbody>${list.map(l => renderPositionRow(l)).join('')}</tbody><tfoot><tr><td colspan="4" class="bold">Total (${rows.length})</td><td class="text-right tabular bold">${fmtNum(sc.pos)}</td><td class="text-right tabular bold">${fmtNum(sc.emp)}</td><td class="text-right tabular warning">${fmtNum(Math.max(0, sc.pos-sc.emp))}</td><td class="text-right tabular muted">${sc.pos>0?((sc.emp/sc.pos)*100).toFixed(0):0}%</td></tr></tfoot></table>${rows.length > 80 ? `<p class="footer">Showing top 80 of ${rows.length} by position count.</p>` : ''}</div>`); }
  function renderPositionRow(l) { const vacant=Math.max(0,l.positions-l.employees); const fill=l.positions>0?l.employees/l.positions:0; const hasStaff=(l.staff||[]).length>0; const open=state.expandedStaff.has(l.loc); let row = `<tr class="${hasStaff?'expandable':''}" data-expand="${hasStaff?l.loc:''}"><td class="muted">${hasStaff ? (open ? '⌄' : '›') : ''}</td><td class="mono">${padLoc(l.loc)}</td><td class="bold">${esc(l.name)}</td><td class="muted" style="font-size:12px">${esc(shortRegion(l.region))}</td><td class="text-right tabular">${icon('building')} ${fmtNum(l.positions)}</td><td class="text-right tabular success">${fmtNum(l.employees)}</td><td class="text-right tabular ${vacant>0?'warning':'muted'}">${fmtNum(vacant)}</td><td class="text-right tabular muted">${(fill*100).toFixed(0)}%</td></tr>`; if (open && hasStaff) row += `<tr class="staff-detail"><td></td><td colspan="7"><div class="table-wrap"><table><tbody>${l.staff.map((s,i)=>{ const filled=!!(s.employee&&s.employee.trim()); return `<tr><td class="mono">${String(i+1).padStart(3,'0')}</td><td class="bold">${filled?esc(employeeName(s.employee)):'<em class="muted">Vacant</em>'}</td><td class="muted">${esc(s.position)}</td><td>${esc(s.job)}</td><td class="text-right"><span class="badge ${filled?'good':'warn'}">${filled?'Filled':'Vacant'}</span></td></tr>`;}).join('')}</tbody></table></div></td></tr>`; return row; }
  function renderDrawer(l) { const u = l.currBudget>0?l.ytdExp/l.currBudget:0; const funcs=[...(l.functions||[])].sort((a,b)=>b.spent-a.spent).slice(0,8); return `<div class="drawer-layer"><div id="drawerBackdrop" class="drawer-backdrop"></div><aside class="drawer"><div class="drawer-head"><div><p class="mono" style="text-transform:uppercase;letter-spacing:.05em;margin:0">Location #${padLoc(l.loc)}</p><h2>${esc(l.name)}</h2><p class="muted" style="font-size:12px;margin:0">${esc(l.region)} · ${esc(l.category || '—')} ${l.boardMember ? '· '+esc(l.boardMember) : ''}</p></div><button id="closeDrawer" class="close-btn" aria-label="Close">×</button></div><div class="drawer-body"><div class="mini-grid">${miniStat('Current Budget',fmtMoney(l.currBudget,true))}${miniStat('YTD Spent',fmtMoney(l.ytdExp,true))}${miniStat('Available',fmtMoney(l.availBal,true),'success')}${miniStat('Enrollment 25/26',fmtNum(l.enrollment2526),'warning')}</div><div class="info-box"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><p class="eyebrow">Utilization</p><p class="bold tabular">${(u*100).toFixed(1)}%</p></div><div class="stacked" style="height:10px"><div style="background:var(--gradient-primary);width:${Math.min(u*100,100)}%"></div></div></div><div class="yoy-grid">${yoyCell('Budget 23/24',fmtMoney(l.budget2324,true))}${yoyCell('Budget 24/25',fmtMoney(l.budget2425,true))}${yoyCell('Budget 25/26',fmtMoney(l.currBudget,true),true)}${yoyCell('Enrollment 23/24',fmtNum(l.enrollment2324))}${yoyCell('Enrollment 24/25',fmtNum(l.enrollment2425))}${yoyCell('Enrollment 25/26',fmtNum(l.enrollment2526),true)}</div>${funcs.length ? `<div><h3 class="card-title" style="margin-bottom:8px">Top Functions / Objects</h3><div class="table-wrap"><table><thead><tr><th>Function</th><th class="text-right">Budget</th><th class="text-right">Spent</th><th class="text-right">Available</th></tr></thead><tbody>${funcs.map(f=>`<tr><td>${esc(f.name)}</td><td class="text-right tabular">${fmtMoney(f.budget,true)}</td><td class="text-right tabular">${fmtMoney(f.spent,true)}</td><td class="text-right tabular success">${fmtMoney(f.available,true)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}${(l.programs||[]).length ? `<div><h3 class="card-title" style="margin-bottom:8px">Programs (Enrollment 25/26)</h3><div class="program-tags">${l.programs.map(p=>`<span class="program-tag"><strong>${esc(p.program)}</strong><span class="program-count">${p.enrollment}</span></span>`).join('')}</div></div>` : ''}<div class="mini-grid">${miniStat('Positions',fmtNum(l.positions))}${miniStat('Employees',fmtNum(l.employees))}</div>${l.address ? `<div class="info-box muted" style="font-size:12px"><p style="margin:0">${esc(l.address)}</p>${l.phone ? `<p style="margin:3px 0 0">${esc(l.phone)}</p>` : ''}</div>` : ''}</div></aside></div>`; }
  function miniStat(label, value, cls='') { return `<div class="mini-stat"><p class="label">${esc(label)}</p><p class="value ${cls}">${esc(value)}</p></div>`; }
  function yoyCell(label, value, hi=false) { return `<div class="yoy-cell ${hi?'highlight':''}"><p class="label">${esc(label)}</p><p class="value tabular">${esc(value)}</p></div>`; }

  function barChart(items, opts) {
    const w=900,h=390,m={l:64,r:20,t:16,b:opts.rotate?104:54}, plotW=w-m.l-m.r, plotH=h-m.t-m.b; const keys=opts.series.map(s=>s[0]); const max=Math.max(1,...items.flatMap(d=>keys.map(k=>Number(d[k])||0)))*1.12; const groupW=plotW/Math.max(1,items.length), barW=Math.max(5, Math.min(34, groupW/(keys.length+1)));
    const y = v => m.t + plotH - (v/max)*plotH; let grid=''; for(let i=0;i<=4;i++){ const yy=m.t+plotH*i/4; const val=max*(1-i/4); grid += `<line x1="${m.l}" x2="${w-m.r}" y1="${yy}" y2="${yy}" stroke="#dde5ee" stroke-dasharray="3 3"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" class="axis-label">${opts.compactMoney?fmtMoney(val,true):fmtNum(val)}</text>`; }
    let bars=''; items.forEach((d,i)=>{ const gx=m.l+i*groupW+groupW/2; opts.series.forEach((s,j)=>{ const val=Number(d[s[0]])||0, bh=plotH-(y(val)-m.t), x=gx - (barW*keys.length)/2 + j*barW, yy=y(val); bars += `<rect x="${x}" y="${yy}" width="${barW-2}" height="${bh}" rx="4" fill="${s[2]}"/><text x="${x+(barW-2)/2}" y="${Math.max(yy+14,m.t+12)}" text-anchor="middle" fill="white" font-size="9" font-weight="700" transform="${opts.rotate && items.length>4 ? `rotate(-90 ${x+(barW-2)/2} ${Math.max(yy+14,m.t+12)})` : ''}">${opts.compactMoney?fmtMoney(val,true):fmtNum(val)}</text>`; }); const lab=String(d.name||d.year||''); bars += `<text x="${gx}" y="${m.t+plotH+18}" text-anchor="${opts.rotate?'end':'middle'}" class="x-label" transform="${opts.rotate?`rotate(-30 ${gx} ${m.t+plotH+18})`:''}">${esc(lab.length>26?lab.slice(0,25)+'…':lab)}</text>`; });
    const legend = `<div class="chart-legend">${opts.series.map(s=>`<span class="legend-item"><span class="legend-swatch" style="background:${s[2]}"></span>${esc(s[1])}</span>`).join('')}</div>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><g>${grid}${bars}</g></svg>${legend}`;
  }
  function horizontalBar(items) { const w=900,h=455,m={l:250,r:36,t:18,b:36}, plotW=w-m.l-m.r, rowH=(h-m.t-m.b)/Math.max(1,items.length), max=Math.max(1,...items.flatMap(d=>[d.positions,d.employees]))*1.15; let out=''; items.forEach((d,i)=>{ const y=m.t+i*rowH+5, bh=Math.max(8,rowH*.28), pW=(d.positions/max)*plotW, eW=(d.employees/max)*plotW; out += `<text x="${m.l-10}" y="${y+bh+4}" text-anchor="end" class="x-label">${esc(d.name.length>34?d.name.slice(0,33)+'…':d.name)}</text><rect x="${m.l}" y="${y}" width="${pW}" height="${bh}" rx="4" fill="${chartColors[2]}"/><text x="${Math.max(m.l+16,m.l+pW-18)}" y="${y+bh-3}" text-anchor="end" fill="white" font-size="11" font-weight="700">${fmtNum(d.positions)}</text><rect x="${m.l}" y="${y+bh+4}" width="${eW}" height="${bh}" rx="4" fill="${chartColors[3]}"/><text x="${Math.max(m.l+16,m.l+eW-18)}" y="${y+bh*2+1}" text-anchor="end" fill="white" font-size="11" font-weight="700">${fmtNum(d.employees)}</text>`; }); return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${out}</svg><div class="chart-legend"><span class="legend-item"><span class="legend-swatch" style="background:${chartColors[2]}"></span>Positions</span><span class="legend-item"><span class="legend-swatch" style="background:${chartColors[3]}"></span>Employees Filled</span></div>`; }
  function lineChart(items) { const w=780,h=240,m={l:60,r:24,t:28,b:36}, plotW=w-m.l-m.r, plotH=h-m.t-m.b; const max=Math.max(1,...items.map(d=>d.enrollment))*1.15; const x=i=>m.l+i*plotW/Math.max(1,items.length-1); const y=v=>m.t+plotH-(v/max)*plotH; let grid=''; for(let i=0;i<=4;i++){ const yy=m.t+plotH*i/4; grid += `<line x1="${m.l}" x2="${w-m.r}" y1="${yy}" y2="${yy}" stroke="#dde5ee" stroke-dasharray="3 3"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" class="axis-label">${fmtNum(max*(1-i/4))}</text>`; } const pts=items.map((d,i)=>`${x(i)},${y(d.enrollment)}`).join(' '); const circles=items.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.enrollment)}" r="5" fill="${chartColors[1]}"/><text x="${x(i)}" y="${y(d.enrollment)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#17233b">${fmtNum(d.enrollment)}</text><text x="${x(i)}" y="${m.t+plotH+24}" text-anchor="middle" class="axis-label">${esc(d.year)}</text>`).join(''); return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<polyline points="${pts}" fill="none" stroke="${chartColors[1]}" stroke-width="3"/>${circles}</svg>`; }
  function pieChart(items) { const w=420,h=310,cx=210,cy=130,r=90,inner=54,total=items.reduce((s,d)=>s+d.value,0)||1; let a=-Math.PI/2, seg=''; items.forEach((d,i)=>{ const ang=(d.value/total)*Math.PI*2, end=a+ang, large=ang>Math.PI?1:0; const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end), ix1=cx+inner*Math.cos(end), iy1=cy+inner*Math.sin(end), ix2=cx+inner*Math.cos(a), iy2=cy+inner*Math.sin(a); seg += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${inner} ${inner} 0 ${large} 0 ${ix2} ${iy2} Z" fill="${chartColors[i%chartColors.length]}" stroke="white" stroke-width="2"/>`; const mid=a+ang/2; seg += `<text x="${cx+(r+18)*Math.cos(mid)}" y="${cy+(r+18)*Math.sin(mid)}" text-anchor="middle" font-size="11" font-weight="700" fill="#17233b">${fmtMoney(d.value,true)}</text>`; a=end; }); const legend=items.map((d,i)=>`<span class="legend-item"><span class="legend-swatch" style="background:${chartColors[i%chartColors.length]}"></span>${esc(d.name.length>28?d.name.slice(0,27)+'…':d.name)}</span>`).join(''); return `<svg class="chart" viewBox="0 0 ${w} ${h}">${seg}<circle cx="${cx}" cy="${cy}" r="${inner-2}" fill="white"/><text x="${cx}" y="${cy-3}" text-anchor="middle" class="axis-label">Total</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="15" font-weight="800" fill="#17233b">${fmtMoney(total,true)}</text></svg><div class="chart-legend">${legend}</div>`; }

  function bindEvents(rows) {
    const $ = id => document.getElementById(id);
    if ($('regionSelect')) $('regionSelect').onchange = e => { state.region=e.target.value; state.school='ALL'; render(); };
    if ($('schoolSelect')) $('schoolSelect').onchange = e => { state.school=e.target.value; if (state.school !== 'ALL') { const match=locations.find(l=>String(l.loc)===state.school); if (match && match.region) state.region=match.region; } render(); };
    if ($('clearBtn')) $('clearBtn').onclick = () => { Object.assign(state, {region:'ALL',school:'ALL',search:'',showPositive:true,showNegative:true}); render(); };
    if ($('positiveBox')) $('positiveBox').onchange = e => { state.showPositive=e.target.checked; render(); };
    if ($('negativeBox')) $('negativeBox').onchange = e => { state.showNegative=e.target.checked; render(); };
    if ($('searchInput')) $('searchInput').oninput = e => { state.search=e.target.value; render(); };
    if ($('sortSelect')) $('sortSelect').onchange = e => { state.sortBy=e.target.value; render(); };
    if ($('exportBtn')) $('exportBtn').onclick = () => exportExcel(rows);
    if ($('saveComment')) $('saveComment').onclick = () => { const l=rows[0]; if (!l) return; state.commentEdits[String(l.loc)] = { reason:$('commentReason').value, recommendation:$('commentRecommendation').value, regionRecommend:$('commentRegion').value }; saveJson('ceeCommentEdits', state.commentEdits); alert('Saved'); render(); };
    document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { state.selected = locations.find(l=>String(l.loc)===el.getAttribute('data-open')); render(); });
    document.querySelectorAll('[data-expand]').forEach(el => el.onclick = () => { const id=Number(el.getAttribute('data-expand')); if (!id) return; state.expandedStaff.has(id) ? state.expandedStaff.delete(id) : state.expandedStaff.add(id); render(); });
    if ($('closeDrawer')) $('closeDrawer').onclick = () => { state.selected=null; render(); };
    if ($('drawerBackdrop')) $('drawerBackdrop').onclick = () => { state.selected=null; render(); };
  }
  function exportExcel(rows) {
    const summary = rows.map(l => [l.loc,l.name,l.region,l.category,l.origBudget,l.currBudget,l.ytdExp,l.ytdEnc,l.availBal,l.budget2324,l.budget2425,l.enrollment2324,l.enrollment2425,l.enrollment2526,l.positions,l.employees]);
    const html = `<html><head><meta charset="utf-8"></head><body><table><tr>${['Location','Name','Region','Category','Original Budget','Current Budget','YTD Expenditures','YTD Encumbered','Available Balance','Budget 23/24','Budget 24/25','Enrollment 23/24','Enrollment 24/25','Enrollment 25/26','Positions','Employees'].map(h=>`<th>${h}</th>`).join('')}</tr>${summary.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></body></html>`;
    const blob = new Blob([html], {type:'application/vnd.ms-excel'}); const url = URL.createObjectURL(blob); const a=document.createElement('a'); const scopeName = state.school !== 'ALL' && rows.length===1 ? rows[0].name.replace(/[^A-Za-z0-9]+/g,'_') : state.region !== 'ALL' ? state.region.replace(/[^A-Za-z0-9]+/g,'_') : 'Filtered'; a.href=url; a.download=`Budget_Export_${scopeName}.xls`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  render();
})();
</script>
